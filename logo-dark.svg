<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="arcGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5BE" />
      <stop offset="60%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#00F0C0" />
    </linearGradient>
    <linearGradient id="leafLeftGradDark" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <linearGradient id="leafRightGradDark" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>
    <linearGradient id="topBookGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bottomBookGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <g transform="translate(250, 200)">
    <!-- Circular Arc: starts from bottom-left to top-right with gap for digital pixels -->
    <path d="M -115,35 A 125,125 0 1,1 95,-75"
          fill="none" stroke="url(#arcGradDark)" stroke-width="12" stroke-linecap="round" />

    <!-- Digital Tech Pixels (floating top-right) -->
    <rect x="76" y="-124" width="22" height="22" rx="4" fill="#34D399" />
    <rect x="108" y="-140" width="20" height="20" rx="4" fill="#38BDF8" />
    <rect x="144" y="-132" width="18" height="18" rx="3.5" fill="#38BDF8" />
    <rect x="122" y="-108" width="20" height="20" rx="4" fill="#67E8F9" />
    <rect x="102" y="-80" width="18" height="18" rx="3.5" fill="#38BDF8" />

    <!-- Graduation Cap / Mortarboard (Light / White on dark) -->
    <polygon points="0,-116 68,-92 0,-68 -68,-92" fill="#F8FAFC" />
    <path d="M -30,-80 Q 0,-66 30,-80 L 26,-70 Q 0,-58 -26,-70 Z" fill="#E2E8F0" />
    <circle cx="0" cy="-92" r="3.5" fill="#E2E8F0" />
    <path d="M 0,-92 C 28,-90 48,-80 50,-56" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" />
    <rect x="46" y="-56" width="8" height="18" rx="2" fill="#F8FAFC" />

    <!-- Green Leaves (Behind arms) -->
    <path d="M -16,-12 C -46,-12 -86,-42 -96,-74 C -84,-44 -44,-30 -16,-12 Z"
          fill="url(#leafLeftGradDark)" />
    <path d="M 16,-12 C 46,-12 86,-42 96,-74 C 84,-44 44,-30 16,-12 Z"
          fill="url(#leafRightGradDark)" />

    <!-- Student Figure (Center) -->
    <circle cx="0" cy="-44" r="18" fill="#F8FAFC" />
    <path d="M 0,26 L -20,-10 C -45,-38 -72,-46 -78,-46 C -74,-36 -46,-10 -14,14 L 0,38 L 14,14 C 46,-10 74,-36 78,-46 C 72,-46 45,-38 20,-10 Z"
          fill="#F8FAFC" />

    <!-- Open Book Pages at Base -->
    <path d="M 0,38 C -40,16 -96,16 -140,24 C -136,36 -88,34 -46,46 C -24,52 -10,64 0,72 C 10,64 24,52 46,46 C 88,34 136,36 140,24 C 96,16 40,16 0,38 Z"
          fill="url(#topBookGradDark)" />
    <path d="M 0,72 C -30,62 -80,56 -130,56 C -122,76 -74,78 -38,88 C -20,93 -8,102 0,108 C 8,102 20,93 38,88 C 74,78 122,76 130,56 C 80,56 30,62 0,72 Z"
          fill="url(#bottomBookGradDark)" />
    <polygon points="0,38 -4,110 0,114 4,110" fill="#0F172A" />
  </g>

  <!-- Typography: sanjeevani_szv -->
  <g transform="translate(250, 395)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
      <tspan fill="#F8FAFC">sanjeevani</tspan><tspan fill="#34D399">_szv</tspan>
    </text>
  </g>

  <!-- Subtitle: Student Innovation – Smart Education -->
  <g transform="translate(250, 435)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-weight="600" font-size="18.5" fill="#93C5FD" letter-spacing="0.5">
      Student Innovation – Smart Education
    </text>
  </g>
</svg>
