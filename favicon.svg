<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="favArc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BFA5" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#00C49F" />
    </linearGradient>
    <linearGradient id="favLeaf" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2E7D32" />
      <stop offset="100%" stop-color="#4CAF50" />
    </linearGradient>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0B2545" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="320" height="320" rx="64" fill="#F8FAFC" />

  <g transform="translate(160, 160) scale(0.95)">
    <!-- Circular Arc -->
    <path d="M -115,35 A 125,125 0 1,1 95,-75"
          fill="none" stroke="url(#favArc)" stroke-width="13" stroke-linecap="round" />

    <!-- Digital Tech Pixels -->
    <rect x="76" y="-124" width="22" height="22" rx="4" fill="#00BFA5" />
    <rect x="108" y="-140" width="20" height="20" rx="4" fill="#0284C7" />
    <rect x="144" y="-132" width="18" height="18" rx="3.5" fill="#0284C7" />
    <rect x="122" y="-108" width="20" height="20" rx="4" fill="#0ea5e9" />
    <rect x="102" y="-80" width="18" height="18" rx="3.5" fill="#0284C7" />

    <!-- Mortarboard -->
    <polygon points="0,-116 68,-92 0,-68 -68,-92" fill="#0B2545" />
    <path d="M -30,-80 Q 0,-66 30,-80 L 26,-70 Q 0,-58 -26,-70 Z" fill="#07192F" />
    <circle cx="0" cy="-92" r="3.5" fill="#07192F" />
    <path d="M 0,-92 C 28,-90 48,-80 50,-56" fill="none" stroke="#0B2545" stroke-width="3" stroke-linecap="round" />
    <rect x="46" y="-56" width="8" height="18" rx="2" fill="#0B2545" />

    <!-- Leaves -->
    <path d="M -16,-12 C -46,-12 -86,-42 -96,-74 C -84,-44 -44,-30 -16,-12 Z" fill="url(#favLeaf)" />
    <path d="M 16,-12 C 46,-12 86,-42 96,-74 C 84,-44 44,-30 16,-12 Z" fill="url(#favLeaf)" />

    <!-- Student Figure -->
    <circle cx="0" cy="-44" r="18" fill="#0B2545" />
    <path d="M 0,26 L -20,-10 C -45,-38 -72,-46 -78,-46 C -74,-36 -46,-10 -14,14 L 0,38 L 14,14 C 46,-10 74,-36 78,-46 C 72,-46 45,-38 20,-10 Z" fill="#0B2545" />

    <!-- Open Book -->
    <path d="M 0,38 C -40,16 -96,16 -140,24 C -136,36 -88,34 -46,46 C -24,52 -10,64 0,72 C 10,64 24,52 46,46 C 88,34 136,36 140,24 C 96,16 40,16 0,38 Z" fill="url(#favCyan)" />
    <path d="M 0,72 C -30,62 -80,56 -130,56 C -122,76 -74,78 -38,88 C -20,93 -8,102 0,108 C 8,102 20,93 38,88 C 74,78 122,76 130,56 C 80,56 30,62 0,72 Z" fill="url(#favBlue)" />
    <polygon points="0,38 -4,110 0,114 4,110" fill="#07192F" />
  </g>
</svg>
